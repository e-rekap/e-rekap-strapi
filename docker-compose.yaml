services:
  postgres:
    image: postgres:18.6
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
      LC_ALL: en_US.utf8
      LANG: en_US.utf8
    volumes:
      - pgsql:/var/lib/postgresql

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"

volumes:
  pgsql: