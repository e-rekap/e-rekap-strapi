# Postgres + Elasticsearch + Kibana untuk development lokal.
# Jalankan: docker compose up -d
# Kredensial Postgres diambil dari DATABASE_* di .env.

services:
  postgres:
    image: postgres:16
    container_name: e-rekap-postgres
    environment:
      - POSTGRES_DB=${DATABASE_NAME:-strapi}
      - POSTGRES_USER=${DATABASE_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD belum di-set di .env}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - e-rekap-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
    container_name: erekap-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - erekap-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.2
    container_name: erekap-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Volume lama dari container Postgres sebelumnya, dipakai ulang supaya data tidak hilang.
  e-rekap-pgdata:
    external: true
  erekap-es-data:
